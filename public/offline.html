<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Offline | ShopEasy</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef2ff; color: #1e1b4b; text-align: center; padding: 1rem; }
    main { max-width: 22rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { color: #4b5563; margin: 0 0 1.25rem; }
    a, button { background: #4f46e5; color: #fff; border: 0; border-radius: .375rem; padding: .6rem 1.2rem; font-size: 1rem; text-decoration: none; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>ShopEasy could not reach the network. Pages you have already opened may still work. Check your connection and try again.</p>
    <a href="./" onclick="location.reload(); return false;">Try again</a>
  </main>
</body>
</html>
